  - { id: n5-nagara, title: "〜ながら (одновременность)", level: n5, register: neutral, group: "Простая форма", prerequisites: [n5-masu-form], status: planned }
  - { id: n5-mae-ni-ato-de, title: "〜前に・〜後で (до и после)", level: n5, register: neutral, group: "Простая форма", prerequisites: [n5-plain-form-present, n5-plain-form-past], status: planned }

  - { id: n5-tai, title: "〜たい (желание)", level: n5, register: neutral, group: "Желание и приглашение", prerequisites: [n5-masu-form], status: planned }
  - { id: n5-ga-hoshii, title: "〜が欲しい (хочу что-то)", level: n5, register: neutral, group: "Желание и приглашение", prerequisites: [n5-wa-vs-ga], status: planned }


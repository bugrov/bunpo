  - { id: n5-naru, title: "〜になる・〜くなる (становиться)", level: n5, register: neutral, group: "Прилагательные", prerequisites: [n5-adverb-form], status: planned }
  - { id: n5-suru-ni, title: "〜にする・〜くする (делать, выбирать)", level: n5, register: neutral, group: "Прилагательные", prerequisites: [n5-naru], status: planned }

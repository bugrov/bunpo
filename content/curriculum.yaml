# Перечень всех запланированных тем грамматики. Это единая точка правды о том, ЧТО мы пишем и В КАКОМ ПОРЯДКЕ.
#
# - Порядок записей = рекомендуемый порядок изучения (сначала N5, затем разговорная речь N5, N4, разговорная речь N4–N3).
# - status: planned (файла ещё нет), draft (файл в content/grammar/<level>/<id>.yaml написан, не проверен), reviewed (проверен пользователем).
# - Для draft и reviewed поля level, register и status обязаны совпадать с файлом пункта. Это проверяет tests/unit/curriculum.test.ts.
# - prerequisites: id пунктов, которые нужно знать раньше; они должны стоять в списке выше.
# - Темы составлены по ориентирам из оглавлений (Первова, Тае Ким, Genki, списки JLPT) и своим знаниям; названия и разбивка авторские.
# - N3 и выше добавим отдельным этапом. Пока здесь только N5, N4 и разговорный трек.

entries:
  # ───────────── N5: копула и вопросы ─────────────
  - { id: n5-wa-desu, title: "AはBです", level: n5, register: polite, group: "Копула и вопросы", status: draft }
  - { id: n5-copula-negative-past, title: "〜じゃないです / 〜でした / 〜じゃなかったです", level: n5, register: polite, group: "Копула и вопросы", prerequisites: [n5-wa-desu], status: planned }
  - { id: n5-ka-question, title: "Вопросительная частица か", level: n5, register: polite, group: "Копула и вопросы", prerequisites: [n5-wa-desu], status: planned }
  - { id: n5-alternative-question, title: "Альтернативный вопрос «AですかBですか»", level: n5, register: polite, group: "Копула и вопросы", prerequisites: [n5-ka-question], status: planned }
  - { id: n5-speech-styles, title: "Стили речи: простой, вежливый, кэйго", level: n5, register: neutral, group: "Копула и вопросы", prerequisites: [n5-wa-desu], status: planned }
  - { id: n5-set-phrases, title: "Приветствия и устойчивые вежливые фразы (いただきます, ただいま)", level: n5, register: polite, group: "Копула и вопросы", status: planned }
  - { id: n5-question-words, title: "Вопросительные слова (何・誰・いつ・どこ・どうして)", level: n5, register: polite, group: "Копула и вопросы", prerequisites: [n5-ka-question], status: planned }
  - { id: n5-address-forms, title: "Обращение: местоимения и суффиксы さん・くん・ちゃん", level: n5, register: neutral, group: "Копула и вопросы", prerequisites: [n5-wa-desu], status: planned }

  # ───────────── N5: указательные слова ─────────────

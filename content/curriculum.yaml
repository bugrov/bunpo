  - { id: n5-no-pronoun, title: "の вместо существительного (私のです)", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-particle-no], status: planned }
  - { id: n5-arimasu-imasu, title: "あります・います (есть, находится)", level: n5, register: polite, group: "Частицы", prerequisites: [n5-wa-vs-ga], status: planned }
  - { id: n5-spatial-words, title: "Слова места: 上・下・前・後ろ・中・隣", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-arimasu-imasu, n5-particle-no], status: planned }
  - { id: n5-ni-time, title: "に со временем", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-wa-desu], status: planned }
  - { id: n5-particle-wo, title: "を (прямое дополнение)", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-wa-desu], status: planned }
  - { id: n5-wo-kudasai, title: "〜をください (дайте, пожалуйста)", level: n5, register: polite, group: "Частицы", prerequisites: [n5-particle-wo], status: planned }
  - { id: n5-word-order, title: "Порядок слов и свобода перестановки частиц", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-particle-wo, n5-wa-vs-ga], status: planned }
  - { id: n5-ellipsis, title: "Опущение подлежащего и контекст", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-word-order], status: planned }
  - { id: n5-particle-de-place, title: "で: место действия", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-particle-wo], status: planned }
  - { id: n5-particle-de-means, title: "で: орудие и транспорт", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-particle-de-place], status: planned }
  - { id: n5-particle-to, title: "と «вместе с» и «и»", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-wa-desu], status: planned }
  - { id: n5-ya-toka, title: "や・とか (неполное перечисление)", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-particle-to], status: planned }
  - { id: n5-kara-made, title: "から・まで (от и до)", level: n5, register: neutral, group: "Частицы", prerequisites: [n5-ni-time], status: planned }
  - { id: n5-particle-ga-but, title: "が «но, а»", level: n5, register: polite, group: "Частицы", prerequisites: [n5-wa-vs-ga], status: planned }

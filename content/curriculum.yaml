  - { id: n5-kono-sono-ano, title: "この・その・あの・どの", level: n5, register: neutral, group: "Указательные слова", prerequisites: [n5-kore-sore-are], status: planned }
  - { id: n5-koko-soko-asoko, title: "ここ・そこ・あそこ・どこ", level: n5, register: neutral, group: "Указательные слова", prerequisites: [n5-kore-sore-are], status: planned }
  - { id: n5-kochira-sochira, title: "こちら・そちら・あちら・どちら", level: n5, register: polite, group: "Указательные слова", prerequisites: [n5-koko-soko-asoko], status: planned }
  - { id: n5-indefinite-pronouns, title: "誰か・誰も・誰でも (неопределённые, отрицательные, обобщающие)", level: n5, register: neutral, group: "Указательные слова", prerequisites: [n5-question-words], status: planned }


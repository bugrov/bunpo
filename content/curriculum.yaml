  - { id: n5-mou-mada, title: "もう〜ました / まだ〜ていません (уже и ещё не)", level: n5, register: polite, group: "Глаголы: формы", prerequisites: [n5-masu-negative-past], status: planned }
  - { id: n5-ni-motion, title: "へ и に с глаголами движения", level: n5, register: neutral, group: "Глаголы: формы", prerequisites: [n5-masu-form], status: planned }
  - { id: n5-motion-purpose, title: "Цель движения: 〜に行く / 来る", level: n5, register: neutral, group: "Глаголы: формы", prerequisites: [n5-ni-motion], status: planned }
  - { id: n5-wo-motion, title: "を с глаголами движения (道を歩く)", level: n5, register: neutral, group: "Глаголы: формы", prerequisites: [n5-ni-motion], status: planned }

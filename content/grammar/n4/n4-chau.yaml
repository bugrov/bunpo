id: n4-chau
level: n4
register: casual
status: draft
tags: [разговорная речь, сокращение, сожаление]
title: 〜ちゃう / 〜じゃう
summary: "Разговорное сокращение от 〜てしまう: «сделал до конца» или «сделал, и вот незадача»."
formation:
  - "て-форма на -て + しまう → 〜ちゃう (食べてしまう → 食べちゃう)"
  - "て-форма на -で + しまう → 〜じゃう (飲んでしまう → 飲んじゃう)"
  - "Прошедшее: 〜ちゃった / 〜じゃった (忘れてしまった → 忘れちゃった)"
explanation: |
  〜てしまう выражает два оттенка: действие доведено до конца («съел всё») или произошло нечто нежелательное («забыл», «потерял»).
  В живой речи это сокращается: 〜てしまう → 〜ちゃう, 〜でしまう → 〜じゃう.

  Это разговорная форма для друзей, семьи и неформальной обстановки.
  Начальнику, преподавателю и в тексте, который пишут вежливо, говорят полную форму 〜てしまいました.

  Часто несёт эмоцию: сожаление, неловкость, лёгкое удивление. Интонация решает, что именно вы хотите сказать.
pitfalls:
  - "Только неформальная речь: с вышестоящими говорите 〜てしまいました."
  - "После -んで (飲む, 読む, 遊ぶ) используется じゃう, а не ちゃう: 飲んじゃった, не 飲んちゃった."
  - "После -って и -いて остаётся ちゃう: 帰っちゃった, 書いちゃった."
  - "Не любое 〜ちゃう — сожаление: 全部食べちゃった может звучать и просто как «всё съел»."
related: []
prerequisites: [n5-te-kudasai]
examples:
  - jp: "{宿題|しゅくだい}を{忘|わす}れちゃった。"
    ru: "Забыл(а) сделать домашку."
  - jp: "ケーキ、{全部|ぜんぶ}{食|た}べちゃった。"
    ru: "Весь торт съел(а)."
  - jp: "ごめん、{寝|ね}ちゃった。"
    ru: "Прости, я уснул(а)."
  - jp: "この{本|ほん}、もう{読|よ}んじゃった。"
    ru: "Эту книгу я уже прочитал(а)."
  - jp: "{財布|さいふ}を{落|お}としちゃった。"
    ru: "Я уронил(а) кошелёк."
dialogues:
  - lines:
      - speaker: A
        jp: "どうしたの？"
        ru: "Что случилось?"
      - speaker: B
        jp: "{携帯|けいたい}を{忘|わす}れちゃった。"
        ru: "Забыл(а) телефон."
      - speaker: A
        jp: "えっ、{取|と}りに{戻|もど}る？"
        ru: "Что, вернёшься за ним?"
exercises:
  - type: choice
    prompt: "Выберите разговорную форму {飲|の}んでしまった:"
    options: ["飲んじゃった", "飲んちゃった", "飲っちゃった", "飲いちゃった"]
    answerIndex: 0
  - type: choice
    prompt: "Выберите разговорную форму {帰|かえ}ってしまった:"
    options: ["帰っちゃった", "帰んじゃった", "帰いちゃった", "帰しちゃった"]
    answerIndex: 0
  - type: cloze
    text: "{宿題|しゅくだい}、{{忘れ|わすれ}}ちゃった。"
    translation: "Домашку забыл(а)."
  - type: reorder
    words: ["ケーキ、", "全部", "食べ", "ちゃった"]
    translation: "Весь торт съел(а)."
  - type: translate
    prompt: "Эту книгу я уже прочитал(а). (разг.)"
    answers:
      - "この本、もう読んじゃった。"
      - "この本もう読んじゃった。"
      - "この本、もうよんじゃった。"

id: n5-wa-desu
level: n5
register: polite
status: draft
tags: [связка, представление, частица]
title: AはBです
summary: Вежливое утверждение «A — это B».
formation:
  - "Существительное A + は + существительное B + です"
  - "Отрицание: AはBではありません (в речи чаще AはBじゃありません)"
  - "Вопрос: AはBですか"
explanation: |
  Частица は (в этой роли читается «ва», а не «ха») отмечает тему предложения: то, о чём мы говорим.
  Всё, что идёт после темы, сообщает о ней новое: AはBです — «что касается A, то это B».

  です — вежливая связка, примерно как русское «есть/это», которое мы обычно не произносим.
  Она ставится в конце и делает фразу вежливой. Для вопроса достаточно добавить か в конце.

  Отрицание строится так: ではありません (в разговоре чаще じゃありません). В прошедшем времени:
  でした («был»), ではありませんでした («не был»).
examples:
  - jp: "わたしは{学生|がくせい}です。"
    ru: "Я студент."
  - jp: "{田中|たなか}さんは{先生|せんせい}です。"
    ru: "Танака — учитель."
  - jp: "これは{本|ほん}です。"
    ru: "Это книга."
  - jp: "わたしは{日本人|にほんじん}ではありません。"
    ru: "Я не японец."
  - jp: "{山田|やまだ}さんは{医者|いしゃ}じゃありません。"
    ru: "Ямада — не врач."
    note: "じゃありません — разговорный вариант ではありません."
dialogues:
  - lines:
      - speaker: A
        jp: "はじめまして。{田中|たなか}です。"
        ru: "Приятно познакомиться. Я Танака."
      - speaker: B
        jp: "{李|り}です。{学生|がくせい}ですか。"
        ru: "Я Ли. Вы студент?"
      - speaker: A
        jp: "はい、{学生|がくせい}です。"
        ru: "Да, студент."
pitfalls:
  - "Как частица は читается «ва», но пишется хираганой «ха»."
  - "は отмечает тему, а не просто подлежащее: «Я — студент» и «Что до меня, я студент» звучат по-японски одинаково."
  - "です — вежливая форма. С друзьями связку обычно опускают или говорят だ."
  - "Вопросительного знака в японском нет: вопрос задаёт か в конце."
related: []
prerequisites: []
exercises:
  - type: choice
    prompt: "わたし＿学生です。 (Выберите частицу темы)"
    options: ["は", "を", "に", "で"]
    answerIndex: 0
  - type: cloze
    text: "これは{{ほん|本}}です。"
    translation: "Это книга."
  - type: cloze
    text: "わたしは{{がくせい|学生}}{{です}}。"
    translation: "Я студент."
  - type: reorder
    words: ["わたしは", "学生", "です"]
    translation: "Я студент."
  - type: translate
    prompt: "Я не японец."
    answers:
      - "わたしは日本人ではありません。"
      - "わたしは日本人じゃありません。"

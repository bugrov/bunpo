  - type: choice
    prompt: "Выберите て-форму глагола {飲|の}む:"
    options: ["飲んで", "飲いて", "飲って", "飲して"]
    answerIndex: 0
  - type: cloze
    text: "{窓|まど}を{{開けて|あけて}}ください。"
    translation: "Откройте окно, пожалуйста."
  - type: reorder
    words: ["ここに", "名前を", "書いて", "ください"]
    translation: "Напишите здесь своё имя, пожалуйста."
  - type: translate
    prompt: "Говорите, пожалуйста, медленнее."
    answers:
      - "ゆっくり話してください。"
      - "ゆっくりはなしてください。"

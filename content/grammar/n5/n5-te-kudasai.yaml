id: n5-te-kudasai
level: n5
register: polite
status: draft
tags: [просьба, て-форма]
title: 〜てください
summary: Вежливая просьба «пожалуйста, сделайте…».
formation:
  - "Глагол в て-форме + ください"
  - "書く → 書いてください"
  - "食べる → 食べてください"
  - "する → してください / 来る → 来てください"
explanation: |
  て-форма + ください — стандартная вежливая просьба или мягкая инструкция: «пожалуйста, сделайте…».

  Как образуется て-форма:
  • 1-я группа (глаголы на -う, -つ, -る): окончание → って (待つ → 待って, 買う → 買って)
  • 1-я группа (-む, -ぶ, -ぬ): → んで (飲む → 飲んで)
  • 1-я группа (-く): → いて (書く → 書いて), но 行く → 行って
  • 1-я группа (-ぐ): → いで (泳ぐ → 泳いで)
  • 1-я группа (-す): → して (話す → 話して)
  • 2-я группа (-る после い/え): る → て (食べる → 食べて)
  • Неправильные: する → して, 来る → 来て
pitfalls:
  - "Это просьба, а не приказ, но с вышестоящими и в сервисе обычно говорят вежливее (〜ていただけませんか)."
  - "行く — исключение: 行いて не бывает, правильно 行ってください."
  - "Отрицательная просьба «не делайте» строится иначе: 〜ないでください."
  - "В магазине и на вывесках ください может стоять и без て: «ください» после существительного — «дайте»."
related: []
prerequisites: []
examples:
  - jp: "ちょっと{待|ま}ってください。"
    ru: "Подождите немного, пожалуйста."
  - jp: "ここに{名前|なまえ}を{書|か}いてください。"
    ru: "Напишите здесь своё имя, пожалуйста."
  - jp: "もう{少|すこ}しゆっくり{話|はな}してください。"
    ru: "Говорите, пожалуйста, чуть медленнее."
  - jp: "{窓|まど}を{開|あ}けてください。"
    ru: "Откройте окно, пожалуйста."
  - jp: "{日本語|にほんご}で{言|い}ってください。"
    ru: "Скажите, пожалуйста, по-японски."
dialogues:
  - lines:
      - speaker: A
        jp: "すみません、もう{一度|いちど}{言|い}ってください。"
        ru: "Простите, повторите ещё раз, пожалуйста."
      - speaker: B
        jp: "はい。{駅|えき}はあそこです。"
        ru: "Да. Станция вон там."
